<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste Düzenleme</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-2xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-4">Liste Düzenleme</h1>
        <form id="edit-list-form" class="mb-4">
            <label for="list-name" class="block text-gray-700">Liste Adý:</label>
            <input type="text" id="list-name" class="w-full px-3 py-2 mt-1 border rounded" required>
            <input type="hidden" id="list-id" class="w-full px-3 py-2 mt-1 border rounded">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Güncelle</button>
        </form>
        <button id="back-button" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Geri</button>
        <script>
            document.getElementById('back-button').addEventListener('click', () => {
                window.history.back();
            });
        </script>
    </div>
</body>
</html>
