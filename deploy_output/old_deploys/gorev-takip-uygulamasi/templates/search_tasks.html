<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev Arama ve Filtreleme</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-2xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-4">Görev Arama ve Filtreleme</h1>
        <form id="search-form" class="flex flex-col space-y-4">
            <div class="flex flex-col space-y-2">
                <label for="task-name" class="block text-gray-700">Görev Adý</label>
                <input type="text" id="task-name" name="task-name" class="p-2 border rounded" required>
            </div>
            <div class="flex flex-col space-y-2">
                <label for="task-status" class="block text-gray-700">Görev Durumu</label>
                <select id="task-status" name="task-status" class="p-2 border rounded" required>
                    <option value="">Seçiniz</option>
                    <option value="pending">Bekleyen</option>
                    <option value="in_progress">Ýþlemde</option>
                    <option value="completed">Tamamlandý</option>
                </select>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Ara</button>
        </form>
    </div>
    <script>
        document.getElementById('search-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            fetch('https://api.example.com/tasks/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(response => response.json()).then(data => {
                console.log(data);
            }).catch(error => {
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
