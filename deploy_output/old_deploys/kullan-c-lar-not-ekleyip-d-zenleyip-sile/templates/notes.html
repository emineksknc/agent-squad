<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .notes { margin-top: 20px; }
        .note { margin-bottom: 20px; }
        .note-header { display: flex; justify-content: space-between; align-items: center; }
        .note-header button { margin-left: 10px; }
    </style>
</head>
<body>
    <h1>Notes</h1>
    <form id="note-form">
        <input type="text" id="note-title" placeholder="Title" required>
        <textarea id="note-content" placeholder="Content" required></textarea>
        <button type="submit">Add Note</button>
    </form>
    <div class="notes" id="notes"></div>
    <script>
        document.getElementById('note-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const title = document.getElementById('note-title').value;
            const content = document.getElementById('note-content').value;
            const response = await fetch('/not', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, content })
            });
            const data = await response.json();
            if (response.ok) {
                document.getElementById('notes').innerHTML += `
                    <div class="note" id="note-${data.id}">
                        <div class="note-header">
                            <h2>${data.title}</h2>
                            <div>
                                <button onclick="editNote(${data.id})">Edit</button>
                                <button onclick="confirmDeleteNote(${data.id})">Delete</button>
                            </div>
                        </div>
                        <p>${data.content}</p>
                    </div>
                `;
                document.getElementById('note-title').value = '';
                document.getElementById('note-content').value = '';
            }
        });

        function editNote(id) {
            const note = document.getElementById(`note-${id}`);
            const titleInput = document.createElement('input');
            titleInput.type = 'text';
            titleInput.value = note.querySelector('h2').innerText;
            note.querySelector('.note-header').innerHTML = `
                <h2>${titleInput}</h2>
                <div>
                    <button onclick="saveEdit(${id}, ${titleInput.value})">Save</button>
                    <button onclick="cancelEdit(${id})">Cancel</button>
                </div>
            `;
        }

        function saveEdit(id, title) {
            const response = fetch(`/not/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title })
            });
            response.then(() => {
                const note = document.getElementById(`note-${id}`);
                note.querySelector('h2').innerText = title;
                cancelEdit(id);
            });
        }

        function cancelEdit(id) {
            const note = document.getElementById(`note-${id}`);
            note.querySelector('h2').innerText = note.querySelector('h2').innerText;
            note.querySelector('.note-header').innerHTML = `
                <h2>${note.querySelector('h2').innerText}</h2>
                <div>
                    <button onclick="editNote(${id})">Edit</button>
                    <button onclick="confirmDeleteNote(${id})">Delete</button>
                </div>
            `;
        }

        function confirmDeleteNote(id) {
            if (confirm('Are you sure you want to delete this note?')) {
                fetch(`/not/${id}`, {
                    method: 'DELETE'
                }).then(() => {
                    document.getElementById(`note-${id}`).remove();
                });
            }
        }

        async function loadNotes() {
            const response = await fetch('/not');
            const data = await response.json();
            data.forEach(note => {
                document.getElementById('notes').innerHTML += `
                    <div class="note" id="note-${note.id}">
                        <div class="note-header">
                            <h2>${note.title}</h2>
                            <div>
                                <button onclick="editNote(${note.id})">Edit</button>
                                <button onclick="confirmDeleteNote(${note.id})">Delete</button>
                            </div>
                        </div>
                        <p>${note.content}</p>
                    </div>
                `;
            });
        }

        loadNotes();
    </script>
</body>
</html>
